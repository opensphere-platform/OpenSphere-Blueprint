title: OpenSphere Blueprint
description: OpenSphere 계층 구조 설계, 구조 방향, 명세 초안
lang: ko
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: false
exclude:
  - "._*"
  - ".DS_Store"
